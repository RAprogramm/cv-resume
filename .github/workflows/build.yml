name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1)'
        required: false
        type: string

env:
  RESUME: Rozanov_Andrei_CV
  LANGUAGES: ru en ko vi
  TYPST_VERSION: 0.15.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Determine version
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            if [ -f .VERSION ]; then
              VER="$(cat .VERSION)"
            else
              VER="$(date +%Y.%m)-latest"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build all languages
        run: |
          mkdir -p release
          for lang in $LANGUAGES; do
            echo "Building $lang..."
            typst compile \
              --font-path fonts \
              --input lang=$lang \
              --root . \
              resume.typ \
              release/${RESUME}_${lang}.pdf
          done
          ls -lh release/

      - name: Verify fonts are embedded
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          for lang in $LANGUAGES; do
            f="release/${RESUME}_${lang}.pdf"
            if ! pdffonts "$f" | grep -q "Inter"; then
              echo "::error::Inter is not embedded in $f — font setup is broken"
              exit 1
            fi
          done
          if ! pdffonts "release/${RESUME}_ko.pdf" | grep -qi "NotoSansCJK"; then
            echo "::error::Noto Sans CJK KR is not embedded in the Korean PDF"
            exit 1
          fi

      - name: Delete old release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          FILES=""
          for lang in $LANGUAGES; do
            f="release/${RESUME}_${lang}.pdf"
            FILES="$FILES $f"
          done
          gh release create "$TAG" $FILES \
            --title "$TAG - CV Resume" \
            --notes "Languages: $(echo $LANGUAGES | tr ' ' ', ')"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdfs
          path: release/
          retention-days: 7

  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built PDFs
        uses: actions/download-artifact@v8
        with:
          name: resume-pdfs
          path: _site/pdf

      - name: Assemble site
        run: cp site/index.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
