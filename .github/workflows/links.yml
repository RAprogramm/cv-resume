name: Check links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check repo docs links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,429
            --exclude '^tel:'
            --exclude '^mailto:'
            README.md resume.typ
          fail: true

      - name: Check live site links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,429
            --exclude '^tel:'
            --exclude '^mailto:'
            --base-url https://raprogramm.github.io/cv-resume/
            site/index.html
          fail: true

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Broken links found in CV" \
            --body-file lychee/out.md || true
