name: Check links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check repo docs links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,429
            --exclude '^tel:'
            --exclude '^mailto:'
            README.md resume.typ
          fail: true

      - name: Check live site links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,429
            --exclude '^tel:'
            --exclude '^mailto:'
            --base-url https://raprogramm.github.io/cv-resume/
            site/index.html
          fail: true

      - name: Report broken links in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Broken links found in CV in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file lychee/out.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Broken links found in CV" \
              --body-file lychee/out.md
          fi

      - name: Close link issues when green
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Broken links found in CV in:title' \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Link check is green — closing automatically."
          done
